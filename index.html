<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>East Region Golden Path</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@600;700;800&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #0a0c10;
    --surface: #111418;
    --surface2: #181c22;
    --border: #1e242d;
    --text: #e8eaf0;
    --muted: #6b7280;
    --green: #22c55e;
    --green-bg: #052612;
    --green-border: #0d4a1e;
    --yellow: #f59e0b;
    --yellow-bg: #1a1200;
    --yellow-border: #4a3000;
    --red: #ef4444;
    --red-bg: #1a0505;
    --red-border: #4a0d0d;
    --grey: #4b5563;
    --grey-bg: #111418;
    --accent: #3b82f6;
    --accent2: #6366f1;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    line-height: 1.5;
    min-height: 100vh;
  }

  /* ── Header ── */
  header {
    border-bottom: 1px solid var(--border);
    padding: 20px 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--surface);
    position: sticky;
    top: 0;
    z-index: 50;
  }

  .header-left { display: flex; align-items: center; gap: 14px; }

  .logo-mark {
    width: 36px; height: 36px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: 16px;
    color: white;
    flex-shrink: 0;
  }

  .header-title {
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 18px;
    letter-spacing: -0.3px;
  }

  .header-sub {
    font-size: 12px;
    color: var(--muted);
    font-family: 'DM Mono', monospace;
  }

  .header-meta {
    text-align: right;
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    line-height: 1.8;
  }

  .header-date {
    font-size: 13px;
    color: var(--text);
    font-weight: 500;
  }

  /* ── Main ── */
  main { padding: 28px 32px; max-width: 1600px; margin: 0 auto; }

  /* ── Section headers ── */
  .section-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 16px;
    margin-top: 36px;
  }

  .section-header:first-child { margin-top: 0; }

  .section-label {
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    color: var(--muted);
  }

  .section-count {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    background: var(--surface2);
    border: 1px solid var(--border);
    padding: 2px 8px;
    border-radius: 99px;
    color: var(--muted);
  }

  .section-line {
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  /* ── Summary bar ── */
  .summary-bar {
    display: flex;
    gap: 12px;
    margin-bottom: 28px;
    flex-wrap: wrap;
  }

  .summary-chip {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 14px;
    border-radius: 8px;
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    border: 1px solid;
  }

  .summary-chip.green  { background: var(--green-bg);  border-color: var(--green-border);  color: var(--green); }
  .summary-chip.yellow { background: var(--yellow-bg); border-color: var(--yellow-border); color: var(--yellow); }
  .summary-chip.red    { background: var(--red-bg);    border-color: var(--red-border);    color: var(--red); }
  .summary-chip.grey   { background: var(--grey-bg);   border-color: var(--border);        color: var(--muted); }

  .chip-dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .chip-num { font-size: 18px; font-weight: 500; line-height: 1; }
  .chip-label { opacity: .7; font-size: 11px; }

  /* ── Facility grid ── */
  .facility-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
    gap: 10px;
  }

  .facility-card {
    border-radius: 10px;
    padding: 14px 14px 12px;
    border: 1px solid;
    transition: transform 0.15s, box-shadow 0.15s;
    cursor: default;
    position: relative;
    overflow: hidden;
  }

  .facility-card::before {
    content: '';
    position: absolute;
    inset: 0;
    opacity: 0;
    transition: opacity 0.15s;
    background: radial-gradient(circle at 50% 0%, currentColor 0%, transparent 70%);
  }

  .facility-card:hover { transform: translateY(-2px); }
  .facility-card:hover::before { opacity: 0.04; }

  .facility-card.green  { background: var(--green-bg);  border-color: var(--green-border);  color: var(--green); }
  .facility-card.yellow { background: var(--yellow-bg); border-color: var(--yellow-border); color: var(--yellow); }
  .facility-card.red    { background: var(--red-bg);    border-color: var(--red-border);    color: var(--red); }
  .facility-card.grey   { background: var(--grey-bg);   border-color: var(--border);        color: var(--muted); }

  .card-name {
    font-family: 'DM Mono', monospace;
    font-weight: 500;
    font-size: 13px;
    color: var(--text);
    margin-bottom: 8px;
    letter-spacing: 0.3px;
  }

  .card-pct {
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: 26px;
    line-height: 1;
    color: currentColor;
  }

  .card-no-data {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    margin-top: 4px;
  }

  .card-bar {
    margin-top: 10px;
    height: 3px;
    background: var(--border);
    border-radius: 99px;
    overflow: hidden;
  }

  .card-bar-fill {
    height: 100%;
    border-radius: 99px;
    background: currentColor;
    transition: width 0.6s ease;
  }

  /* ── SLA Stack Rank table ── */
  .table-wrap {
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }

  thead {
    background: var(--surface2);
    border-bottom: 1px solid var(--border);
  }

  th {
    padding: 11px 16px;
    text-align: left;
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.8px;
    text-transform: uppercase;
    color: var(--muted);
    font-weight: 400;
  }

  tbody tr {
    border-bottom: 1px solid var(--border);
    transition: background 0.1s;
  }

  tbody tr:last-child { border-bottom: none; }
  tbody tr:hover { background: var(--surface2); }

  td {
    padding: 11px 16px;
    color: var(--text);
    font-size: 13px;
  }

  .td-rank {
    font-family: 'DM Mono', monospace;
    color: var(--muted);
    font-size: 11px;
    width: 36px;
  }

  .td-step {
    font-family: 'DM Mono', monospace;
    font-size: 12px;
  }

  .td-facility {
    font-family: 'DM Mono', monospace;
    font-weight: 500;
    font-size: 12px;
  }

  .td-route {
    color: var(--muted);
    font-size: 12px;
    font-family: 'DM Mono', monospace;
  }

  .td-count {
    text-align: right;
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 15px;
  }

  .td-bar { width: 120px; }

  .inline-bar {
    height: 4px;
    background: var(--border);
    border-radius: 99px;
    overflow: hidden;
  }

  .inline-bar-fill {
    height: 100%;
    border-radius: 99px;
    background: var(--red);
    opacity: 0.7;
  }

  /* step type colors */
  .step-hub  { color: var(--accent); }
  .step-truck { color: var(--yellow); }
  .step-spoke { color: #a855f7; }
  .step-dispatch { color: #f97316; }
  .step-delivery { color: var(--green); }

  /* ── Threshold legend ── */
  .legend {
    display: flex;
    gap: 20px;
    margin-top: 20px;
    flex-wrap: wrap;
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--muted);
  }

  .legend-dot { width: 8px; height: 8px; border-radius: 50%; }

  /* ── Footer ── */
  footer {
    margin-top: 48px;
    padding: 20px 32px;
    border-top: 1px solid var(--border);
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
</style>
</head>
<body>

<header>
  <div class="header-left">
    <div class="logo-mark">E</div>
    <div>
      <div class="header-title">East Region Golden Path</div>
      <div class="header-sub">Hub &amp; Spoke OTD Performance</div>
    </div>
  </div>
  <div class="header-meta">
    <div class="header-date" id="display-date">—</div>
    <div>pulled <span id="pulled-at">—</span></div>
    <div>source: Parcel Golden Path · Sigma</div>
  </div>
</header>

<main>

  <!-- Summary bar -->
  <div class="summary-bar" id="summary-bar"></div>

  <!-- Hubs -->
  <div class="section-header">
    <span class="section-label">Hubs</span>
    <span class="section-count" id="hub-count">—</span>
    <span class="section-line"></span>
  </div>
  <div class="facility-grid" id="hub-grid"></div>

  <!-- Spokes -->
  <div class="section-header">
    <span class="section-label">Spokes</span>
    <span class="section-count" id="spoke-count">—</span>
    <span class="section-line"></span>
  </div>
  <div class="facility-grid" id="spoke-grid"></div>

  <!-- SLA Stack Rank -->
  <div class="section-header">
    <span class="section-label">Steps Missing SLA — Yesterday (East Region)</span>
    <span class="section-line"></span>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>#</th>
          <th>Step</th>
          <th>Facility</th>
          <th>Route</th>
          <th style="text-align:right">Misses</th>
          <th class="td-bar"></th>
        </tr>
      </thead>
      <tbody id="sla-tbody"></tbody>
    </table>
  </div>

  <div class="legend">
    <div class="legend-item"><div class="legend-dot" style="background:#22c55e"></div>≥ 95% On Track</div>
    <div class="legend-item"><div class="legend-dot" style="background:#f59e0b"></div>90–94% Watch</div>
    <div class="legend-item"><div class="legend-dot" style="background:#ef4444"></div>&lt; 90% Critical</div>
    <div class="legend-item"><div class="legend-dot" style="background:#4b5563"></div>No Data</div>
  </div>

</main>

<footer>
  <span>East Region Operations · DoorDash</span>
  <span>Created by Paul Brown</span>
</footer>

<script>
async function loadData() {
  const res = await fetch('data/latest.json?t=' + Date.now());
  return res.json();
}

function statusClass(pct) {
  if (pct === null || pct === undefined) return 'grey';
  if (pct >= 95) return 'green';
  if (pct >= 90) return 'yellow';
  return 'red';
}

function stepClass(step) {
  if (step.includes('Hub')) return 'step-hub';
  if (step.includes('Truck')) return 'step-truck';
  if (step.includes('Spoke')) return 'step-spoke';
  if (step.includes('Dispatch')) return 'step-dispatch';
  if (step.includes('Delivery')) return 'step-delivery';
  return '';
}

function renderCard(name, data) {
  const cls = statusClass(data.otd_pct);
  const pct = data.otd_pct;
  const fillPct = pct ? Math.min(100, pct) : 0;
  return `
    <div class="facility-card ${cls}">
      <div class="card-name">${name}</div>
      ${pct !== null && pct !== undefined
        ? `<div class="card-pct">${pct.toFixed(1)}<span style="font-size:14px;font-weight:600;opacity:.6">%</span></div>`
        : `<div class="card-no-data">no data</div>`}
      <div class="card-bar"><div class="card-bar-fill" style="width:${fillPct}%"></div></div>
    </div>`;
}

function renderSummary(facilities) {
  let g = 0, y = 0, r = 0, n = 0;
  Object.values(facilities).forEach(f => {
    const cls = statusClass(f.otd_pct);
    if (cls === 'green') g++;
    else if (cls === 'yellow') y++;
    else if (cls === 'red') r++;
    else n++;
  });
  return `
    <div class="summary-chip green"><div class="chip-dot"></div><span class="chip-num">${g}</span><span class="chip-label">On Track</span></div>
    <div class="summary-chip yellow"><div class="chip-dot"></div><span class="chip-num">${y}</span><span class="chip-label">Watch</span></div>
    <div class="summary-chip red"><div class="chip-dot"></div><span class="chip-num">${r}</span><span class="chip-label">Critical</span></div>
    ${n ? `<div class="summary-chip grey"><div class="chip-dot"></div><span class="chip-num">${n}</span><span class="chip-label">No Data</span></div>` : ''}
  `;
}

function renderSLA(rows) {
  const maxMiss = Math.max(...rows.map(r => r.miss_count));
  return rows.map((row, i) => {
    const barW = Math.round((row.miss_count / maxMiss) * 100);
    const route = row.from_stop !== row.next_stop
      ? `${row.from_stop} → ${row.next_stop}`
      : row.from_stop;
    return `
      <tr>
        <td class="td-rank">${i + 1}</td>
        <td class="td-step"><span class="${stepClass(row.step)}">${row.step}</span></td>
        <td class="td-facility">${row.facility}</td>
        <td class="td-route">${route}</td>
        <td class="td-count">${row.miss_count.toLocaleString()}</td>
        <td class="td-bar"><div class="inline-bar"><div class="inline-bar-fill" style="width:${barW}%"></div></div></td>
      </tr>`;
  }).join('');
}

loadData().then(data => {
  // Header
  const d = new Date(data.date + 'T12:00:00');
  document.getElementById('display-date').textContent =
    d.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
  document.getElementById('pulled-at').textContent = data.pulled_at;

  // Summary
  document.getElementById('summary-bar').innerHTML = renderSummary(data.facilities);

  // Hubs
  const hubs = Object.entries(data.facilities).filter(([,v]) => v.type === 'hub');
  const spokes = Object.entries(data.facilities).filter(([,v]) => v.type === 'spoke');

  document.getElementById('hub-count').textContent = hubs.length;
  document.getElementById('spoke-count').textContent = spokes.length;

  document.getElementById('hub-grid').innerHTML =
    hubs.map(([name, d]) => renderCard(name, d)).join('');
  document.getElementById('spoke-grid').innerHTML =
    spokes.map(([name, d]) => renderCard(name, d)).join('');

  // SLA Stack Rank
  document.getElementById('sla-tbody').innerHTML = renderSLA(data.sla_stack_rank);
}).catch(err => {
  console.error('Failed to load data:', err);
  document.querySelector('main').innerHTML = `
    <div style="text-align:center;padding:80px 20px;color:var(--muted);font-family:'DM Mono',monospace">
      <div style="font-size:32px;margin-bottom:12px">⚠</div>
      <div>No data loaded yet.</div>
      <div style="margin-top:8px;font-size:11px">Trigger a pull to populate data/latest.json</div>
    </div>`;
});
</script>
</body>
</html>
